<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokémon Type Effectiveness – Casual Guide</title>

<style>
:root{
  --bg:#000000;--card:#0d0d0d;--text:#e5e7eb;--muted:#9ca3af;--accent:#a78bfa;--border:rgba(255,255,255,.08);
  --header-bg:#2e1065;--header-text:#ffffff;
  --x4:#dc2626;--x2:#f87171;--x1:#eab308;--x05:#22c55e;--x025:#16a34a;--x0:#60a5fa;
}
body.light{
  --bg:#f4f6fb;--card:#ffffff;--text:#0f172a;--muted:#475569;--accent:#7c3aed;--border:rgba(0,0,0,.08);
  --header-bg:#4c1d95;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;font-weight:500;background:var(--bg);color:var(--text);transition:.3s}

.wrapper{min-height:100%;display:flex;flex-direction:column}

.header{
    padding:1.5rem 1.5rem;
    background: var(--header-bg);
    color: var(--header-text);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.header-row{display:flex;align-items:center;justify-content:center;text-align:center}
.container{width:100%;max-width:960px;margin:0 auto;padding:1.5rem 1.5rem 0;flex:1;background:var(--bg)}

h1{margin:0;font-weight:800;letter-spacing:.02em;font-size: 1.5rem}
.subtitle{color:rgba(255,255,255,0.8);margin:.25rem 0 0;font-size: 0.9rem}

.toggle-group { display: flex; align-items: center; justify-content: center; gap: 2rem; margin-top: 1rem; }
.toggle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.toggle-label-text { font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.6); text-transform: uppercase; }

.theme-toggle input, .go-mode-toggle input {display:none}
.theme-label, .go-label {width:52px;height:28px;background:rgba(255,255,255,0.2);border-radius:999px;position:relative;cursor:pointer;display:inline-block}
.theme-label::after, .go-label::after {position:absolute;top:2px;left:2px;width:24px;height:24px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;transition:.3s;color:#000}

.theme-label::after{content:"🌙"}
.theme-toggle input:checked + .theme-label::after{transform:translateX(24px);content:"☀️"}

.go-label::after{content:"OFF"; font-size: 0.5rem; font-weight: 900;}
.go-mode-toggle input:checked + .go-label::after{transform:translateX(24px); content:"GO"; color: #ef4444;}

.ios-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.ios-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
input:checked + .slider:before { transform: translateX(20px); }

body.light .slider { background-color: #9ca3af; }
body.light input:checked + .slider { background-color: var(--accent); }

.card{background:var(--card);border:1px solid var(--border);border-radius:1.25rem;padding:1rem; position: relative;}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.25rem}

/* Layout for GO Mode */
body.go-active .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
body.go-active .controls .card {
    flex: 1;
    min-width: 250px;
    max-width: 300px;
}

label{font-size:.8rem;color:var(--muted);font-weight:700;display:block}
select{width:100%;padding:.65rem;border-radius:.75rem;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;font-size:.9rem;outline:none;margin-top:0.4rem}
select:disabled{opacity:0.25}

.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem}

.button-group{display:flex;gap:.5rem;margin-top:0.4rem}
button{flex:1;padding:.65rem;border-radius:.75rem;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:.9rem;cursor:pointer;transition:.2s ease}
button.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent)}

.results{margin-top:2rem;display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.results .card h3 { font-size: 1rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }

.card.res-x4 { border: 2px solid var(--x4); }
.card.res-x2 { border: 2px solid #f97316; } 
.card.res-x1 { border: 2px solid var(--x1); } 
.card.res-x05 { border: 2px solid #86efac; } 
.card.res-x025 { border: 2px solid var(--x025); } 
.card.res-x0 { border: 2px solid var(--x0); }

.tag{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .75rem;border-radius:999px;font-size:.75rem;font-weight:800;margin:.15rem}
.x4{background:color-mix(in srgb,var(--x4)20%,transparent);color:var(--x4)}
.x2{background:color-mix(in srgb,#f97316 20%,transparent);color:#f97316}
.x1{background:color-mix(in srgb,var(--x1)20%,transparent);color:var(--x1)}
.x05{background:color-mix(in srgb,#86efac 20%,transparent);color:#86efac}
.x025{background:color-mix(in srgb,var(--x025)20%,transparent);color:var(--x025)}
.x0{background:color-mix(in srgb,var(--x0)20%,transparent);color:var(--x0)}

.type-icon{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.type-icon svg { width: 12px; height: 12px; fill: white; }

footer{margin-top:2rem;text-align:center;color:var(--muted);font-size:.75rem;padding:1rem 0;background:var(--bg);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrapper">
  <header class="header">
    <div class="header-row">
      <div class="header-title">
        <h1>Pokémon Type Effectiveness Guide</h1>
        <p class="subtitle">Gen 1–9 Reference • Supports Abilities and Terastallize</p>
        
        <div class="toggle-group">
          <div class="toggle-wrapper">
            <span class="toggle-label-text">Theme</span>
            <div class="theme-toggle">
              <input type="checkbox" id="themeToggle" />
              <label for="themeToggle" class="theme-label"></label>
            </div>
          </div>
          <div class="toggle-wrapper">
            <span class="toggle-label-text">Pokemon GO</span>
            <div class="go-mode-toggle">
              <input type="checkbox" id="goToggle" />
              <label for="goToggle" class="go-label"></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div class="card"><label>Primary Type</label><select id="type1"></select></div>
      <div class="card"><label>Secondary Type</label><select id="type2"></select></div>
      
      <div class="card" id="abilityCard">
        <div class="card-header">
          <label>Ability</label>
          <label class="ios-switch"><input type="checkbox" id="abilityToggle"><span class="slider"></span></label>
        </div>
        <select id="abilitySelect"></select>
      </div>

      <div class="card" id="teraCard">
        <div class="card-header">
          <label>Terastallize</label>
          <label class="ios-switch"><input type="checkbox" id="teraToggle"><span class="slider"></span></label>
        </div>
        <select id="teraType" disabled></select>
      </div>

      <div class="card" id="weatherCard" style="display: none;">
        <div class="card-header">
          <label>Weather Boost</label>
          <label class="ios-switch"><input type="checkbox" id="weatherToggle"><span class="slider"></span></label>
        </div>
        <select id="weatherSelect">
          <option value="None">None</option>
          <option value="Clear">Sunny/Clear (Fire, Grass, Ground)</option>
          <option value="Rainy">Rainy (Water, Electric, Bug)</option>
          <option value="Partly Cloudy">Partly Cloudy (Normal, Rock)</option>
          <option value="Cloudy">Cloudy (Fairy, Fighting, Poison)</option>
          <option value="Windy">Windy (Dragon, Flying, Psychic)</option>
          <option value="Snow">Snow (Ice, Steel)</option>
          <option value="Fog">Fog (Dark, Ghost)</option>
        </select>
      </div>

      <div class="card">
        <label>Mode</label>
        <div class="button-group">
          <button id="attackBtn" class="active">Attack</button>
          <button id="defenseBtn">Defense</button>
        </div>
      </div>
    </div>
    <div class="results" id="results"></div>
  </main>

  <footer>
    <div style="margin-bottom:.35rem;font-weight:600">Made by Crownless</div>
    <div style="margin-bottom:.5rem">
      <a href="https://github.com/Crownles-s" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;font-weight:600">Github</a>
    </div>
    <div>Supports Pokemon Go • Supports all mainline Pokemon Games</div>
  </footer>
</div>

<script>
const TYPES=["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];
const WEATHER_TYPES = {
  "None": [],
  "Clear": ["Fire", "Grass", "Ground"],
  "Rainy": ["Water", "Electric", "Bug"],
  "Partly Cloudy": ["Normal", "Rock"],
  "Cloudy": ["Fairy", "Fighting", "Poison"],
  "Windy": ["Dragon", "Flying", "Psychic"],
  "Snow": ["Ice", "Steel"],
  "Fog": ["Dark", "Ghost"]
};

const TYPE_DATA = {
  Normal: { color: '#A8A77A', path: 'M12,2C6.47,2,2,6.47,2,12s4.47,10,10,10s10-4.47,10-10S17.53,2,12,2z M12,17c-2.76,0-5-2.24-5-5s2.24-5,5-5s5,2.24,5,5 S14.76,17,12,17z' },
  Fire: { color: '#EE8130', path: 'M17.43,11.23C16.5,8.19,13,6.3,13,2c0,0-5,2-5,7c0,1.25,0.44,2.39,1.16,3.3C7.45,11.51,6,9.88,6,8c-1.1,1.15-2,3.15-2,5 c0,4.42,3.58,8,8,8s8-3.58,8-8C20,11,17.43,11.23,17.43,11.23z' },
  Water: { color: '#6390F0', path: 'M12,2L4.5,20.29L5.21,21L12,18l6.79,3l0.71-0.71L12,2z' },
  Electric: { color: '#F7D02C', path: 'M7,2v11h3v9l7-12h-4l4-8H7z' },
  Grass: { color: '#7AC74C', path: 'M17,8c-1.11,0-2.07,0.67-2.5,1.63C14.07,8.67,13.11,8,12,8s-2.07,0.67-2.5,1.63C9.07,8.67,8.11,8,7,8 c-1.66,0-3,1.34-3,3c0,3.32,4,7.34,8,11c4-3.66,8-7.68,8-11C20,9.34,18.66,8,17,8z' },
  Ice: { color: '#96D9D6', path: 'M12,2l2.35,5.15L20,9.5l-4.12,4.4L17,20l-5-3.09L7,20l1.12-6.1L4,9.5l5.65-2.35L12,2z' },
  Fighting: { color: '#C22E28', path: 'M19.53,10.66l-1.42-1.42l-3.21,3.21L13.48,11l3.21-3.21l-1.41-1.41l-3.21,3.21l-1.42-1.42l3.21-3.21l-1.41-1.41 l-3.21,3.21L7.63,5.34l3.21-3.21L9.42,0.72l-8.7,8.7l1.41,1.41l3.21-3.21l1.41,1.41l-3.21,3.21l1.42,1.42l3.21-3.21l1.41,1.41 l-3.21,3.21l1.42,1.42l3.21-3.21l1.41,1.41l-3.21,3.21l1.41,1.41l8.71-8.7L19.53,10.66z' },
  Poison: { color: '#A33EA1', path: 'M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,20c-4.41,0-8-3.59-8-8c0-4.41,3.59-8,8-8 s8,3.59,8,8C20,16.41,16.41,20,12,20z' },
  Ground: { color: '#E2BF65', path: 'M12,2L2,7v10l10,5l10-5V7L12,2z M12,4.44l7.78,3.89l-7.78,3.89L4.22,8.33L12,4.44z M4,15.56V9.67l7,3.5v5.89 L4,15.56z M13,19.06v-5.89l7-3.5v5.89L13,19.06z' },
  Flying: { color: '#A98FF3', path: 'M21,3.31C21,3.14,20.86,3,20.69,3h-2.38c-0.12,0-0.23,0.07-0.28,0.18L13,12l-5.04-8.82C7.91,3.07,7.8,3,7.69,3H5.31 C5.14,3,5,3.14,5,3.31c0,0.07,0.02,0.14,0.06,0.2L11,15l-6.94,6.8c-0.12,0.12-0.12,0.32,0,0.44l1.69,1.69c0.12,0.12,0.32,0.12,0.44,0 L13,17.12l6.81,6.81c0.12,0.12,0.32,0.12,0.44,0l1.69-1.69c0.12-0.12,0.12-0.32,0-0.44L15,15l5.94-11.49C20.98,3.45,21,3.38,21,3.31z' },
  Psychic: { color: '#F95587', path: 'M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6 s6,2.69,6,6S15.31,18,12,18z' },
  Bug: { color: '#A6B91A', path: 'M12,10.5c1.38,0,2.5,1.12,2.5,2.5s-1.12,2.5-2.5,2.5s-2.5-1.12-2.5-2.5S10.62,10.5,12,10.5z M13,1h-2v3.19 C9.1,4.59,7.45,5.64,6.23,7.12L4.05,4.94L2.64,6.35l2.45,2.45C4.41,9.8,4,11.05,4,12.4v1.1h2v-1.1c0-2.43,1.97-4.4,4.4-4.4h3.2 c2.43,0,4.4,1.97,4.4,4.4v1.1h2v-1.1c0-1.35-0.41-2.6-1.08-3.6l2.45-2.45l-1.41-1.41l-2.18,2.18C16.55,5.64,14.9,4.59,13,4.19V1z M6.12,15.5c0.55,2.55,2.81,4.5,5.88,4.5s5.33-1.95,5.88-4.5H6.12z' },
  Rock: { color: '#B6A136', path: 'M12,2L4.5,20.29L5.21,21L12,18l6.79,3l0.71-0.71L12,2z' },
  Ghost: { color: '#735797', path: 'M12,2C6.47,2,2,6.47,2,12s4.47,10,10,10s10-4.47,10-10S17.53,2,12,2z M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6 S15.31,18,12,18z' },
  Dragon: { color: '#6F35FC', path: 'M12,2C6.47,2,2,6.47,2,12c0,1.25,0.23,2.45,0.65,3.56L12,22l9.35-6.44C21.77,14.45,22,13.25,22,12 C22,6.47,17.53,2,12,2z M12,16c-2.21,0-4-1.79-4-4s1.79-4,4-4s4,1.79,4,4S14.21,16,12,16z' },
  Dark: { color: '#705746', path: 'M12,2C6.47,2,2,6.47,2,12s4.47,10,10,10s10-4.47,10-10S17.53,2,12,2z M12,17c-2.76,0-5-2.24-5-5s2.24-5,5-5s5,2.24,5,5 S14.76,17,12,17z' },
  Steel: { color: '#B7B7CE', path: 'M12,2L4.5,20.29L5.21,21L12,18l6.79,3l0.71-0.71L12,2z' },
  Fairy: { color: '#D685AD', path: 'M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,20c-4.41,0-8-3.59-8-8c0-4.41,3.59-8,8-8 s8,3.59,8,8C20,16.41,16.41,20,12,20z' }
};

const CHART={Normal:{Rock:.5,Ghost:0,Steel:.5},Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},Ice:{Fire:.5,Water:.5,Ice:.5,Grass:2,Ground:2,Flying:2,Dragon:2,Steel:.5},Fighting:{Normal:2,Ice:2,Rock:2,Dark:2,Steel:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Fairy:.5,Ghost:0},Poison:{Grass:2,Fairy:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},Psychic:{Fighting:2,Poison:2,Psychic:.5,Steel:.5,Dark:0},Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5},Dragon:{Dragon:2,Steel:.5,Fairy:0},Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Fairy:.5},Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Fairy:2,Steel:.5},Fairy:{Fire:.5,Fighting:2,Dragon:2,Dark:2,Poison:.5,Steel:.5}};

const CORE_ABILITIES = { "None": {}, "Delta Stream": { delta: true }, "Dry Skin": { immune: ["Water"], weak: { "Fire": 1.25 } }, "Earth Eater": { immune: ["Ground"] }, "Filter / Solid Rock": { filter: true }, "Flash Fire / Well-Baked Body": { immune: ["Fire"] }, "Fluffy": { weak: { "Fire": 2.0 } }, "Heatproof / Water Bubble": { half: ["Fire"] }, "Levitate": { immune: ["Ground"] }, "Lightning Rod / Volt Absorb": { immune: ["Electric"] }, "Mind's Eye / Scrappy": { scrappy: true }, "Purifying Salt": { half: ["Ghost"] }, "Sap Sipper": { immune: ["Grass"] }, "Storm Drain / Water Absorb": { immune: ["Water"] }, "Tera Shell (Full HP)": { teraShell: true }, "Thick Fat": { half: ["Fire", "Ice"] }, "Wonder Guard": { wonder: true } };

const type1=document.getElementById('type1'), type2=document.getElementById('type2'), abs=document.getElementById('abilitySelect'), abilityToggle=document.getElementById('abilityToggle');
const teraType=document.getElementById('teraType'), teraToggle=document.getElementById('teraToggle');
const results=document.getElementById('results'), attackBtn=document.getElementById('attackBtn'), defenseBtn=document.getElementById('defenseBtn'), themeToggle=document.getElementById('themeToggle'), goToggle=document.getElementById('goToggle');
const weatherCard=document.getElementById('weatherCard'), weatherToggle=document.getElementById('weatherToggle'), weatherSelect=document.getElementById('weatherSelect');
const abilityCard=document.getElementById('abilityCard'), teraCard=document.getElementById('teraCard');

function icon(t){
  const data = TYPE_DATA[t];
  return `<span class="type-icon" style="background:${data.color}">
    <svg viewBox="0 0 24 24"><path d="${data.path}"/></svg>
  </span>`;
}
function fillSelect(sel, items, defaultVal){sel.innerHTML=''; items.forEach(t=>sel.add(new Option(t,t))); if(defaultVal) sel.value = defaultVal;}

fillSelect(type1, ["—", ...TYPES]);
fillSelect(type2, ["—", ...TYPES]);
fillSelect(teraType, TYPES, "Normal");
fillSelect(abs, Object.keys(CORE_ABILITIES));

let mode='attack';
attackBtn.onclick=()=>setMode('attack');
defenseBtn.onclick=()=>setMode('defense');
function setMode(m){mode=m; attackBtn.classList.toggle('active',m==='attack'); defenseBtn.classList.toggle('active',m==='defense'); update();}

themeToggle.onchange=()=>document.body.classList.toggle('light');

goToggle.onchange=()=>{
  const isGO = goToggle.checked;
  document.body.classList.toggle('go-active', isGO);
  abilityCard.style.display = isGO ? 'none' : 'block';
  teraCard.style.display = isGO ? 'none' : 'block';
  weatherCard.style.display = isGO ? 'block' : 'none';
  update();
};

teraToggle.onchange=()=>{ teraType.disabled = !teraToggle.checked; update(); };
abilityToggle.onchange=()=>{ abs.disabled = !abilityToggle.checked; update(); };
weatherToggle.onchange=()=>{ weatherSelect.disabled = !weatherToggle.checked; update(); };
[type1, type2, abs, teraType, weatherSelect].forEach(el => el.onchange = update);

function calc(types){
  const m={}; TYPES.forEach(t=>m[t]=1);
  const isGO = goToggle.checked;
  const abi = (!isGO && abilityToggle.checked) ? (CORE_ABILITIES[abs.value] || {}) : {};
  
  const GO_MULT = { SE: 1.6, NVE: 0.625, IMMUNE: 0.390625 };

  if(mode==='attack'){
    TYPES.forEach(defender => {
      let best = 0;
      types.forEach(attacker => {
        let score = CHART[attacker]?.[defender] ?? 1;
        
        if(isGO) {
           if(score === 2) score = GO_MULT.SE;
           else if(score === 0.5) score = GO_MULT.NVE;
           else if(score === 0) score = GO_MULT.IMMUNE;
           
           if(weatherToggle.checked && WEATHER_TYPES[weatherSelect.value].includes(attacker)) {
             score *= 1.2;
           }
        } else {
           if(abi.scrappy && defender === "Ghost" && (attacker === "Normal" || attacker === "Fighting")) score = 1;
           if(attacker === 'Ice' && defender === 'Water') score = 2; 
        }

        if(score > best) best = score;
      });
      m[defender] = best;
    });
  } else {
    const defTypes = (!isGO && teraToggle.checked) ? [teraType.value] : types;
    TYPES.forEach(attacker => {
      let val = 1;
      defTypes.forEach(def => {
          let eff = CHART[attacker]?.[def] ?? 1;
          
          if(isGO) {
            if(eff === 2) eff = GO_MULT.SE;
            else if(eff === 0.5) eff = GO_MULT.NVE;
            else if(eff === 0) eff = GO_MULT.IMMUNE;
          } else {
            if(abi.delta && defTypes.includes('Flying') && ['Electric','Ice','Rock'].includes(attacker)) eff = 1;
          }
          val *= eff;
      });
      
      if(!isGO) {
          if(abi.immune?.includes(attacker)) val = 0;
          if(abi.half?.includes(attacker)) val *= 0.5;
          if(abi.weak?.[attacker]) val *= abi.weak[attacker];
          if(abi.filter && val > 1) val *= 0.75;
          if(abi.wonder && val <= 1 && val > 0) val = 0;
          if(abi.teraShell) val = 0.5;
      }
      m[attacker] = val;
    });
  }
  return m;
}

function render(m){
  results.innerHTML='';
  const isGO = goToggle.checked;
  const standardConfig = [[4,'x4','res-x4','4×'],[2,'x2','res-x2','2×'],[1,'x1','res-x1','1×'],[.5,'x05','res-x05','0.5×'],[.25,'x025','res-x025','0.25×'],[0,'x0','res-x0','0×']];
  
  if(isGO) {
    const buckets = {};
    Object.entries(m).forEach(([type, val]) => {
      const rounded = Math.round(val * 1000) / 1000;
      if(!buckets[rounded]) buckets[rounded] = [];
      buckets[rounded].push(type);
    });

    Object.keys(buckets).sort((a,b) => b-a).forEach(val => {
      let resClass = 'res-x1';
      let tagClass = 'x1';
      if(val > 1.2) { resClass = 'res-x4'; tagClass = 'x4'; }
      else if(val > 1) { resClass = 'res-x2'; tagClass = 'x2'; }
      else if(val < 1 && val > 0.5) { resClass = 'res-x05'; tagClass = 'x05'; }
      else if(val <= 0.5 && val > 0.3) { resClass = 'res-x025'; tagClass = 'x025'; }
      else if(val <= 0.3) { resClass = 'res-x0'; tagClass = 'x0'; }

      const div = document.createElement('div');
      div.className = `card ${resClass}`;
      div.innerHTML = `<h3>${val}×</h3>`;
      buckets[val].forEach(t => { div.innerHTML += `<span class="tag ${tagClass}">${icon(t)}${t}</span>`; });
      results.appendChild(div);
    });
  } else {
    standardConfig.forEach(([v, c, resClass, label]) => {
      const list = Object.entries(m).filter(e => e[1] === v);
      if(list.length > 0) {
        const div = document.createElement('div');
        div.className = `card ${resClass}`;
        div.innerHTML = `<h3>${label}</h3>`;
        list.forEach(e => { div.innerHTML += `<span class="tag ${c}">${icon(e[0])}${e[0]}</span>`; });
        results.appendChild(div);
      }
    });
  }
}

function update(){
  const tVals = [type1.value, type2.value].filter(v => v && v !== "—");
  if(tVals.length === 0 && !teraToggle.checked){results.innerHTML=''; return;}
  render(calc(tVals));
}
update();
</script>
